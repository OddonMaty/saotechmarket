services:
  mysql:
    image: mysql:8.4
    container_name: saotech_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_local_dev
      MYSQL_DATABASE: saotech_market
      MYSQL_USER: saotech_user
      MYSQL_PASSWORD: saotech_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:

